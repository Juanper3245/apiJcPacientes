<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Pacientes - API REST</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <div class="container my-4">

        <!-- Barra de acciones: Buscar por ID y Nuevo Paciente -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-center">
                    
                    <!-- Buscar Paciente por ID -->
                    <div class="col-12 col-md-6">
                        <form id="formBuscarId" class="d-flex gap-2">
                            <input type="number" id="inputIdBusqueda" class="form-control" placeholder="Ingresa ID del paciente..." min="1" required>
                            <button type="submit" class="btn btn-info text-white text-nowrap">
                                <i class="bi bi-search me-1"></i>Ver por ID
                            </button>
                        </form>
                    </div>

                    <!-- Botones: Crear y Recargar -->
                    <div class="col-12 col-md-6 text-md-end">
                        <button class="btn btn-secondary me-2" onclick="listarPacientes()">
                            <i class="bi bi-arrow-repeat me-1"></i>Recargar Lista
                        </button>
                        <button class="btn btn-success" onclick="abrirModalCrear()">
                            <i class="bi bi-plus-circle me-1"></i>Crear Paciente
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Tabla de pacientes -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped table-hover align-middle mb-0">
                        <thead class="table-dark text-nowrap">
                            <tr>
                                <th style="width: 70px;">ID</th>
                                <th>Nombre</th>
                                <th style="width: 80px;">Edad</th>
                                <th style="width: 100px;">Género</th>
                                <th>Diagnóstico</th>
                                <th>Fecha</th>
                                <th class="text-center" style="width: 180px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPacientes">
                            <!-- Filas generadas con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 1: Formulario para Crear / Actualizar Paciente -->
    <div class="modal fade" id="modalPaciente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white" id="modalHeader">
                    <h5 class="modal-title" id="modalTitulo">Nuevo Paciente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="formPaciente">
                    <div class="modal-body">
                        <!-- Campo oculto para el ID en caso de actualizar -->
                        <input type="hidden" id="pacienteId">

                        <div class="mb-3">
                            <label for="pacienteNombre" class="form-label fw-bold">Nombre *</label>
                            <input type="text" class="form-control" id="pacienteNombre" required placeholder="Ej: Carlos Gómez">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="pacienteEdad" class="form-label fw-bold">Edad *</label>
                                <input type="number" class="form-control" id="pacienteEdad" min="0" max="150" required placeholder="Ej: 35">
                            </div>
                            <div class="col-6 mb-3">
                                <label for="pacienteGenero" class="form-label fw-bold">Género *</label>
                                <select class="form-select" id="pacienteGenero" required>
                                    <option value="" disabled selected>Selecciona...</option>
                                    <option value="M">Masculino (M)</option>
                                    <option value="F">Femenino (F)</option>
                                    <option value="O">Otro (O)</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="pacienteDiagnostico" class="form-label fw-bold">Diagnóstico</label>
                            <textarea class="form-control" id="pacienteDiagnostico" rows="2" placeholder="Ej: Control de rutina, dolor de cabeza..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL 2: Ver Paciente por ID -->
    <div class="modal fade" id="modalVer" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title"><i class="bi bi-person-badge me-2"></i>Ficha del Paciente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="contenidoVer">
                    <!-- Se llena dinámicamente -->
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica de la API -->
    <script src="js/app.js"></script>
</body>
</html>
